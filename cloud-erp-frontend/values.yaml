replicaCount: 1

name: cloud-erp-frontend

image:
  repository: harbor.fayevr.dev/fleet/cloud-erp-frontend
  tag: "0.0.34"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: "traefik"
  annotations:
    # HTTP-01: uhr.works is not on Cloudflare, so the DNS-01 issuer cannot answer for it.
    cert-manager.io/cluster-issuer: "letsencrypt-prod-http01"
  hosts:
    - host: erp.uhr.works
      paths:
        # /api routed to the backend Service so the frontend can call
        # same-origin — keeps auth cookies first-party and avoids CORS.
        - path: "/api"
          pathType: Prefix
          service: cloud-erp-backend-service
          port: 80
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - erp.uhr.works
      secretName: cloud-erp-frontend-uhr-tls

# Old hostnames, answered with a permanent redirect to `to` with the path kept. A served
# frontend there would call api.uhr.works cross-site, and the strict session cookies
# would not travel.
redirectHosts:
  - host: erp.headpat.dev
    to: erp.uhr.works
    secretName: cloud-erp-frontend-tls

# ESO pulls runtime env (any Sentry / branding vars) from the configured
# store. Most frontend env is baked at build time via VITE_*, but a few
# runtime-only knobs go here.
externalSecret:
  enabled: true
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-cloud-erp
  remoteRef:
    key: vault-cloud-erp/frontend
  targetSecretName: cloud-erp-frontend

secrets:
  name: cloud-erp-frontend
  imagePullSecrets:
    - name: harbor-secret

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "128Mi"
    cpu: "100m"

podAnnotations: {}

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: "/"
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

# Logins and session cookies must not travel over cleartext :80. cert-manager
# builds its own solver Ingress for HTTP-01, which does not carry this
# middleware, so ACME challenges still answer in the clear.
httpsRedirect:
  enabled: true
