replicaCount: 2

name: apps-panel-backend

image:
  repository: harbor.fayevr.dev/fleet/apps-panel-backend
  tag: "0.19.91"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8787

ingress:
  enabled: true
  className: "traefik"
  annotations:
    # Without this the router binds to every Traefik entrypoint, so the API
    # also answered on the 250 tenant tcp-* ports, none of which have TLS.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # P-256 is ~RSA-3072 strength with far cheaper handshakes and a smaller
    # cert, unlike RSA-4096 which only buys handshake cost.
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/private-key-rotation-policy: Always
  hosts:
    - host: api.headpat.space
      paths:
        - path: "/api"
          pathType: Prefix
        # Public API reference. Routed separately because everything else on this
        # host lives under /api.
        - path: "/docs"
          pathType: Prefix
        - path: "/openapi.json"
          pathType: Prefix
  tls:
    - hosts:
        - api.headpat.space
      secretName: apps-panel-backend-tls-secret

# External Secrets Operator pulls the panel's runtime env (DATABASE_URL,
# BETTER_AUTH_SECRET, Stripe keys, etc.) from the configured store and
# materialises it as a regular Secret that the Deployment mounts via envFrom.
externalSecret:
  enabled: true
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-apps-panel
  remoteRef:
    key: apps-panel/backend-env
  targetSecretName: apps-panel-backend-env

# Used when externalSecret.enabled is false — provide a Secret you've already
# created and reference it here.
secrets:
  name: apps-panel-backend-env
  imagePullSecrets:
    - name: harbor-secret

resources:
  limits:
    memory: "1Gi"
    cpu: "500m"
  requests:
    memory: "512Mi"
    cpu: "200m"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8787"

probes:
  liveness:
    path: "/health"
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  readiness:
    path: "/health"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# The cron jobs live in apps-panel-worker, not here, so the backend is safe to
# run at more than one replica. HPA stays off only because the load is steady;
# scale by hand.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# API keys travel in Authorization headers, which were being served over
# cleartext :80. cert-manager builds its own solver Ingress for HTTP-01, which
# does not carry this middleware, so ACME challenges still answer in the clear.
httpsRedirect:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

# The spread is hard so two replicas can never share a node, the anti-affinity
# is only a preference so it never blocks scheduling.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: apps-panel-backend

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - apps-panel-frontend
                  - apps-panel-marketing
                  - apps-panel-worker

# A node is marked NotReady after 40s; the default then waits a further 300s
# before moving the pod. 60s cuts API downtime from ~6min to ~2min and is still
# long enough to ride out a brief control-plane blip.
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60

# ServiceAccount + RBAC. The fine-grained permissions (apps-panel-cluster +
# apps-panel-tenant ClusterRoles) live in infra/apps-cluster/panel-rbac-v2.yaml
# and are applied once per cluster — independent of any Helm release. This
# chart just creates the SA and an optional break-glass binding.
serviceAccount:
  name: apps-panel

rbac:
  # DO NOT enable in normal operation. Temporary break-glass only: grants
  # the panel SA cluster-admin on the entire cluster. Default false.
  useClusterAdmin: false
