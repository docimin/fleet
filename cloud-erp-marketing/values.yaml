replicaCount: 1

name: cloud-erp-marketing

image:
  repository: harbor.fayevr.dev/fleet/cloud-erp-marketing
  tag: "0.0.7"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: "traefik"
  annotations:
    # HTTP-01: uhr.works is not on Cloudflare, so the DNS-01 issuer cannot answer for it.
    cert-manager.io/cluster-issuer: "letsencrypt-prod-http01"
  hosts:
    - host: uhr.works
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - uhr.works
      secretName: cloud-erp-marketing-uhr-tls

# Other hostnames, answered with a permanent redirect to `to` with the path kept. www goes
# too, so only uhr.works has to be in the backend's ALLOWED_ORIGINS.
redirectHosts:
  - host: www.uhr.works
    to: uhr.works
    secretName: cloud-erp-marketing-www-tls
  - host: erpmarketing.headpat.dev
    to: uhr.works
    secretName: cloud-erp-marketing-tls

# Marketing needs no runtime secrets (only PORT). Disabled — and the
# vault-cloud-erp store is not currently healthy. Re-enable if marketing
# ever needs env from Vault.
externalSecret:
  enabled: false
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-cloud-erp
  remoteRef:
    key: vault-cloud-erp/marketing
  targetSecretName: cloud-erp-marketing

secrets:
  name: cloud-erp-marketing
  imagePullSecrets:
    - name: harbor-secret

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "128Mi"
    cpu: "100m"

podAnnotations: {}

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: "/"
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
