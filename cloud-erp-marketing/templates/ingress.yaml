{{- if .Values.ingress.enabled }}
{{- $middlewares := list }}
{{- range $i, $r := .Values.redirectHosts }}
{{- $middlewares = append $middlewares (printf "%s-%s-redirect-host-%d@kubernetescrd" $.Release.Namespace $.Values.name $i) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.name }}-service
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
    {{- range .Values.redirectHosts }}
    # Never reaches the Service: the redirect-host middleware answers first.
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.name }}-service
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
  tls:
    {{- with .Values.ingress.tls }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- range .Values.redirectHosts }}
    - hosts:
        - {{ .host }}
      secretName: {{ .secretName }}
    {{- end }}
{{- end }}
