{{- if .Values.pdb.enabled }}
# Dashboard only — the bot is intentionally single-replica, so a PDB over it
# would block node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.name }}-dashboard-pdb
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Values.name }}-dashboard
{{- end }}
