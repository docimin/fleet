apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-dashboard
  labels:
    app: {{ .Values.name }}-dashboard
spec:
  selector:
    app: {{ .Values.name }}-dashboard
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
  type: {{ .Values.service.type }}
