apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-bot
  labels:
    app: {{ .Values.name }}-bot
    component: bot
spec:
  replicas: {{ .Values.bot.replicaCount }}
  # The gateway connection must drop before the replacement connects, otherwise
  # both briefly receive the same events.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}-bot
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-bot
        component: bot
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bot
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["bun", "run", "--filter", "@modmail/bot", "start"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: internal-api
              containerPort: {{ .Values.bot.port }}
          env:
            - name: INTERNAL_API_HOST
              value: {{ .Values.bot.host | quote }}
            - name: INTERNAL_API_PORT
              value: {{ .Values.bot.port | quote }}
            {{- include "modmail.databaseUrlEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "modmail.envSecretName" . }}
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: internal-api
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            successThreshold: {{ .Values.probes.liveness.successThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: internal-api
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        {{- range .Values.secrets.imagePullSecrets }}
        - name: {{ .name }}
        {{- end }}
