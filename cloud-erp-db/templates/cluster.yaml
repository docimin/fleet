apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.image }}
  primaryUpdateStrategy: unsupervised
  # Promote an updated replica first instead of restarting the primary in place.
  primaryUpdateMethod: switchover
  {{- with .Values.cluster.smartShutdownTimeout }}
  smartShutdownTimeout: {{ . }}
  {{- end }}
  enableSuperuserAccess: {{ .Values.cluster.enableSuperuserAccess }}
  storage:
    size: {{ .Values.cluster.storage.size }}
    storageClass: {{ .Values.cluster.storage.storageClass }}
    resizeInUseVolumes: true
  bootstrap:
    initdb:
      database: {{ .Values.cluster.database }}
      owner: {{ .Values.cluster.owner }}
      encoding: UTF8
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "32"
      max_worker_processes: "32"
      {{- with .Values.cluster.maxSlotWalKeepSize }}
      max_slot_wal_keep_size: {{ . | quote }}
      {{- end }}
  resources:
    {{- toYaml .Values.cluster.resources | nindent 4 }}
  {{- with .Values.cluster.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.cluster.name }}-store
{{- end }}
{{- range .Values.cluster.extraDatabases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Values.cluster.name }}-{{ . }}
spec:
  cluster:
    name: {{ $.Values.cluster.name }}
  name: {{ . }}
  owner: {{ $.Values.cluster.owner }}
{{- end }}
