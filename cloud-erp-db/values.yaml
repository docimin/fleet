cluster:
  name: erp-pg
  instances: 3
  # Match the image the apps-panel cluster runs (PG 18.3).
  image: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  storage:
    size: 10Gi
    storageClass: ceph-rbd-kubernetes
  # Control DB for cloud-erp. Tenant DBs are created dynamically by the
  # backend's provisioning flow (CREATE DATABASE), which is why the
  # superuser must be reachable — see enableSuperuserAccess below.
  database: mgmt
  owner: erp
  # Additional databases to create alongside the bootstrap one (CNPG
  # Database CRs). Empty for the tenants cluster — tenant DBs are created
  # dynamically by the backend via CREATE DATABASE.
  extraDatabases: []
  # cloud-erp's tenant provisioning connects as the postgres superuser to
  # CREATE DATABASE / CREATE ROLE per tenant. CNPG only materialises the
  # `<cluster>-superuser` secret when this is true.
  enableSuperuserAccess: true
  # A primary that CNPG's isolation check shuts down (it fires while any peer
  # is unreachable, e.g. during a node reboot) otherwise waits the 180 s
  # default for idle clients before the failover can start.
  smartShutdownTimeout: 30
  # A standby stuck on an old timeline keeps an inactive slot that otherwise
  # retains WAL without limit (apps-panel-db: 17 GB in four days, 2026-11-06).
  maxSlotWalKeepSize: 4GB
  # CPU peaked at 0.93 of 1 core (7 days to 2026-11-05).
  resources:
    limits:
      cpu: "2000m"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 256Mi
  # One instance per node: two on one node made that node a single point of failure.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

# Streaming replicas cover node and disk loss, not a bad migration or a DROP -
# that damage reaches every replica instantly. WAL archiving plus a daily base
# backup is what makes point-in-time recovery possible.
#
# Staggered off apps-panel-db's 03:00 so the four clusters don't all upload at
# once. Schedule is CNPG's 6-field form (seconds first).
backup:
  enabled: true
  bucket: k8s-apps
  endpointURL: https://s3.headpat.space
  vaultKey: apps-panel/s3-backup-credentials
  secretStore: vault-apps-panel
  retention: 30d
  schedule: "0 15 3 * * *"

# Always-on pod with psql + the cluster's superuser credentials, for
# ad-hoc scripts: kubectl -n <ns> exec -it deploy/erp-pg-client -- psql
# or pipe a file: ... exec -i deploy/erp-pg-client -- psql < script.sql
psqlClient:
  enabled: true
