{{- if .Values.httpCurlCard.enabled }}
# Plain-http curl on the home page reaches the app, which answers with its text
# card; every other plain-http request still takes the https redirect.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.name }}-curl-card-http
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.httpCurlCard.host }}`) && Path(`/`) && HeaderRegexp(`User-Agent`, `^curl/`)
      priority: 1000
      services:
        - name: {{ .Values.name }}-service
          port: {{ .Values.service.port }}
{{- end }}
