replicaCount: 2

name: apps-panel-frontend

image:
  repository: harbor.fayevr.dev/fleet/apps-panel-frontend
  tag: "0.13.176"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5173

ingress:
  enabled: true
  className: "traefik"
  annotations:
    # Without this the router binds to every Traefik entrypoint, so the panel
    # also answered on the 250 tenant tcp-* ports, none of which have TLS.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # P-256 is ~RSA-3072 strength with far cheaper handshakes and a smaller
    # cert, unlike RSA-4096 which only buys handshake cost.
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/private-key-rotation-policy: Always
  hosts:
    - host: panel.headpat.space
      paths:
        # /api routed to backend Service so the frontend can call same-origin
        # — keeps auth cookies first-party and avoids CORS.
        - path: "/api"
          pathType: Prefix
          service: apps-panel-backend-service
          port: 80
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - panel.headpat.space
      secretName: apps-panel-frontend-tls

# ESO pulls VITE_BACKEND_URL and any Sentry/branding vars from the configured
# store. Most frontend env is baked at build time, but VITE_BACKEND_URL needs
# to be set at runtime to point at the backend Service / public URL.
externalSecret:
  enabled: true
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-apps-panel
  remoteRef:
    key: apps-panel/frontend-env
  targetSecretName: apps-panel-frontend-env

secrets:
  name: apps-panel-frontend-env
  imagePullSecrets:
    - name: harbor-secret

# Same burst profile as marketing: SSR spikes on an idle pod, so the CPU ceiling
# sits well above the request to avoid throttling page renders.
resources:
  limits:
    memory: "512Mi"
    cpu: "2000m"
  requests:
    memory: "192Mi"
    cpu: "100m"

podAnnotations: {}

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Login credentials and session cookies were being served over cleartext :80.
# cert-manager builds its own solver Ingress for HTTP-01, which does not carry
# this middleware, so ACME challenges still answer in the clear as required.
httpsRedirect:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

# Both replicas landing on one node would defeat the point, so the spread is a
# hard constraint: 3 nodes and 2 replicas stays satisfiable even with a node
# down. The anti-affinity is only a preference - it keeps the panel's
# components off a single node without ever blocking a pod from starting.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: apps-panel-frontend

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - apps-panel-backend
                  - apps-panel-marketing
                  - apps-panel-worker

# A node is marked NotReady after 40s; the default then waits a further 300s
# before moving the pod. 60s cuts recovery from ~6min to ~2min and is still
# long enough to ride out a brief control-plane blip.
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
