replicaCount: 1

name: apps-panel-frontend

image:
  repository: harbor.fayevr.dev/fleet/apps-panel-frontend
  tag: "0.13.164"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 5173

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # P-256 is ~RSA-3072 strength with far cheaper handshakes and a smaller
    # cert, unlike RSA-4096 which only buys handshake cost.
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/private-key-rotation-policy: Always
  hosts:
    - host: panel.headpat.space
      paths:
        # /api routed to backend Service so the frontend can call same-origin
        # — keeps auth cookies first-party and avoids CORS.
        - path: "/api"
          pathType: Prefix
          service: apps-panel-backend-service
          port: 80
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - panel.headpat.space
      secretName: apps-panel-frontend-tls

# ESO pulls VITE_BACKEND_URL and any Sentry/branding vars from the configured
# store. Most frontend env is baked at build time, but VITE_BACKEND_URL needs
# to be set at runtime to point at the backend Service / public URL.
externalSecret:
  enabled: true
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-apps-panel
  remoteRef:
    key: apps-panel/frontend-env
  targetSecretName: apps-panel-frontend-env

secrets:
  name: apps-panel-frontend-env
  imagePullSecrets:
    - name: harbor-secret

# Same burst profile as marketing: SSR spikes on an idle pod, so the CPU ceiling
# sits well above the request to avoid throttling page renders.
resources:
  limits:
    memory: "512Mi"
    cpu: "2000m"
  requests:
    memory: "192Mi"
    cpu: "100m"

podAnnotations: {}

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
