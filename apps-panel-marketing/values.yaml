replicaCount: 2

name: apps-panel-marketing

image:
  repository: harbor.fayevr.dev/fleet/apps-panel-marketing
  tag: "0.4.59"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # P-256 is ~RSA-3072 strength with far cheaper handshakes and a smaller
    # cert, unlike RSA-4096 which only buys handshake cost.
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "256"
    cert-manager.io/private-key-rotation-policy: Always
  hosts:
    - host: headpat.space
      paths:
        - path: "/"
          pathType: Prefix
    - host: www.headpat.space
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - headpat.space
        - www.headpat.space
      secretName: apps-panel-marketing-tls-secret

# Marketing has minimal runtime env (panel URL, analytics keys). Pull from
# the same store the panel uses; key path is separate so values can differ.
externalSecret:
  enabled: false
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: k8s-apps-panel
  remoteRef:
    key: apps-panel-marketing-env
  targetSecretName: apps-panel-marketing-env

secrets:
  name: apps-panel-marketing-env
  imagePullSecrets:
    - name: harbor-secret

# Per-ingress, not a Traefik entrypoint redirect: a global one would break
# HTTP-01 ACME challenges for customer custom domains.
httpsRedirect:
  enabled: true

# HTTP basic-auth gate (Traefik middleware) for preview/testing.
basicAuth:
  enabled: false
  realm: "Headpat preview"
  users: "faye:$2y$05$BlTvttKJsGkLmTmyIL3DZe6WEXUtWI.esD81UALuC0dXDGccBfOAa"

# SSR renders are short CPU bursts on an otherwise idle pod (avg ~0.005 cores).
# A tight limit throttles those bursts and stalls cold page loads, so the ceiling
# is deliberately far above the request - the request is what reserves capacity.
resources:
  limits:
    memory: "1Gi"
    cpu: "2000m"
  requests:
    memory: "256Mi"
    cpu: "250m"

podAnnotations: {}

probes:
  liveness:
    path: "/"
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: "/"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# Marketing is read-only and stateless, so HPA is reasonable to leave on.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

# Both replicas landing on one node would defeat the point, so the spread is a
# hard constraint: 3 nodes and 2 replicas stays satisfiable even with a node
# down. The anti-affinity is only a preference - it keeps the panel's
# components off a single node without ever blocking a pod from starting.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app: apps-panel-marketing

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - apps-panel-backend
                  - apps-panel-frontend
                  - apps-panel-worker

# A node is marked NotReady after 40s; the default then waits a further 300s
# before moving the pod. 60s cuts recovery from ~6min to ~2min and is still
# long enough to ride out a brief control-plane blip.
tolerations:
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
