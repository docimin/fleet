# Stalwart mail server for our own domains. Installed by hand like the
# apps-panel releases:
#   kubectl create namespace stalwart
#   kubectl label namespace stalwart pod-security.kubernetes.io/enforce=privileged
#   helm upgrade --install stalwart ./stalwart -n stalwart -f stalwart/values.yaml
#
# A cluster of one Stalwart pod per node on the host network. Each node owns
# one floating mail IP pair (keepalived, see floatingIps) and every pod binds
# all of them (ip_nonlocal_bind), so a node serves any IP it holds. Outbound
# SMTP leaves from the node's own mail IP through a host nftables SNAT rule,
# matching its reverse DNS. Pods share PostgreSQL and coordinate through
# Stalwart Keep. Listeners, hostname, TLS (built-in ACME), the in-memory store
# and the license live in the database and are managed through the web UI or
# API; config.json only points at the database.
#
# Host setup per node (outside this chart): /etc/sysctl.d/90-stalwart.conf
# (ip_nonlocal_bind), /etc/nftables.d/91-stalwart-egress.nft with
# nft-stalwart-egress.service, and drops for 8090, 7000, 7100 and VRRP on the
# public interface in /etc/nftables.d/90-hardening.nft.

image:
  repository: stalwartlabs/stalwart
  tag: "v1.1.1"
  pullPolicy: IfNotPresent

# Stalwart pods, at most one per node.
replicas: 3

# The management listener port. 8080 is taken on every node by ceph-csi's
# host-network plugin, so it must be moved off the default.
managementPort: 8090

# First boot only: comes up with just the management listener on
# managementPort, so listeners are configured before any default binds the
# host. Mail and HTTPS listeners bind only the mail IPs; management binds only
# the node's internal address and localhost.
recoveryMode:
  enabled: false
  logLevel: info

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

database:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  size: 20Gi
  storageClass: ceph-rbd-kubernetes
  backup:
    destinationPath: s3://k8s-apps/cnpg/stalwart/stalwart-db/
    endpointURL: https://s3.headpat.space
    retentionPolicy: 30d
    # 6-field cron, seconds first.
    schedule: "0 30 3 * * *"

# Vault keys, synced by external-secrets:
#   envKey: STALWART_LICENSE_KEY, STALWART_API_KEY, STALWART_METRICS_USERNAME,
#           STALWART_METRICS_PASSWORD, KEEPALIVED_AUTH_PASS; add
#           STALWART_RECOVERY_ADMIN (user:password) only to recover a lockout
#   s3Key:  ACCESS_KEY_ID, ACCESS_SECRET_KEY
#   harborPullKey: dockerconfigjson (pull access to the private Harbor images)
#   keepKey: cluster_secret, peer_secret, member-N.key, servers.pem, client.key, clients.pem
externalSecret:
  storeRef:
    name: vault
    kind: ClusterSecretStore
  envKey: stalwart/env
  s3Key: stalwart/s3-backup-credentials
  harborPullKey: stalwart/harbor-pull
  keepKey: stalwart/keep
  refreshInterval: 1h

# Prometheus scraping (Stalwart and its database), blackbox probes and alert
# rules for the kube-prometheus-stack in the monitoring namespace.
monitoring:
  enabled: true
  blackboxProberUrl: blackbox-exporter.monitoring.svc:9115
  probeTargets:
    - https://mail.hpat.email/
    - https://mta-sts.hpat.email/.well-known/mta-sts.txt
  queueBacklogThreshold: 50

# Floating mail IPs. Each node is home for one IPv4/IPv6 pair and holds it
# while its Stalwart is ready; keepalived moves it to a ready node otherwise.
# VRRP adverts run unicast over the internal network.
floatingIps:
  image: harbor.fayevr.dev/fleet/keepalived:2.3.1
  vrrpInterface: eth1
  publicInterface: eth0
  # Seconds keepalived waits before its first election. Longer than the
  # readiness check needs to fail (3 x 2s) or pass (2 x 2s).
  startupDelaySeconds: 8
  nodes:
    - name: kb-a-1
      internalIp: 10.0.10.5
      ipv4: 77.90.16.41
      ipv6: 2a14:7c0:7000:b00::41
      virtualRouterId: 41
    - name: kb-a-2
      internalIp: 10.0.10.4
      ipv4: 77.90.16.42
      ipv6: 2a14:7c0:7000:b00::42
      virtualRouterId: 42
    - name: kb-a-3
      internalIp: 10.0.10.3
      ipv4: 77.90.16.43
      ipv6: 2a14:7c0:7000:b00::43
      virtualRouterId: 43

# Stalwart Keep, the cluster's in-memory store and coordinator (one member
# per node, members taken from floatingIps.nodes). Keep sizes its shards from
# the CPU limit (cgroup cpu.max), so shards must match limits.cpu. The request
# can sit below it (Keep supports burstable pods with a CPU limit); a member
# uses ~0.1 CPU, and a full-core request per node held 3 CPUs of the cluster's
# scheduling headroom for nothing.
keep:
  image: stalwartlabs/keep:v1.0.1
  clientPort: 7000
  peerPort: 7100
  shards: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
