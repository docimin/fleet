apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  # One pod only: the mail IPs live on one node at a time and the old pod must
  # release the host ports before the next one can bind them.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ required "node must name the VM the mail IP is bound to" .Values.node }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/stalwart/config.json"]
          # The binary binds the mail ports through its file capability, which
          # no_new_privs would strip, so privilege escalation stays allowed.
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          env:
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-app
                  key: password
            {{- if .Values.recoveryMode.enabled }}
            - name: STALWART_RECOVERY_MODE
              value: "true"
            - name: STALWART_RECOVERY_MODE_PORT
              value: {{ .Values.managementPort | quote }}
            - name: STALWART_RECOVERY_MODE_LOG_LEVEL
              value: {{ .Values.recoveryMode.logLevel | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          ports:
            - { name: smtp, containerPort: 25 }
            - { name: smtps, containerPort: 465 }
            - { name: submission, containerPort: 587 }
            - { name: imaps, containerPort: 993 }
            - { name: https, containerPort: 443 }
            - { name: management, containerPort: {{ .Values.managementPort }} }
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- if not .Values.recoveryMode.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: logs
              mountPath: /var/log/stalwart
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        # Everything durable lives in PostgreSQL; these only hold scratch data.
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
