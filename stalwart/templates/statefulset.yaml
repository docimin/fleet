apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  # One pod per node at most: the pods share the host's ports. Every pod binds
  # all mail IPs; keepalived puts each IP on a node whose pod is ready.
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: stalwart
                  app.kubernetes.io/instance: {{ .Release.Name }}
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/stalwart/config.json"]
          # The binary binds the mail ports through its file capability, which
          # no_new_privs would strip, so privilege escalation stays allowed.
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          env:
            # The cluster node id is leased per hostname.
            - name: STALWART_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STALWART_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-app
                  key: password
            - name: STALWART_KEEP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keep
                  key: cluster_secret
            {{- if .Values.recoveryMode.enabled }}
            - name: STALWART_RECOVERY_MODE
              value: "true"
            - name: STALWART_RECOVERY_MODE_PORT
              value: {{ .Values.managementPort | quote }}
            - name: STALWART_RECOVERY_MODE_LOG_LEVEL
              value: {{ .Values.recoveryMode.logLevel | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          ports:
            - { name: smtp, containerPort: 25 }
            - { name: smtps, containerPort: 465 }
            - { name: submission, containerPort: 587 }
            - { name: imaps, containerPort: 993 }
            - { name: https, containerPort: 443 }
            - { name: management, containerPort: {{ .Values.managementPort }} }
          livenessProbe:
            tcpSocket:
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- if not .Values.recoveryMode.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: management
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
            - name: logs
              mountPath: /var/log/stalwart
            - name: tmp
              mountPath: /tmp
            - name: keep
              mountPath: /etc/stalwart/keep
              readOnly: true
      volumes:
        # Stalwart's Keep client key and the members' public keys.
        - name: keep
          secret:
            secretName: {{ .Release.Name }}-keep
            defaultMode: 0440
            items:
              - key: client.key
                path: client.key
              - key: servers.pem
                path: servers.pem
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        # Everything durable lives in PostgreSQL; these only hold scratch data.
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
