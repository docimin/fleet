{{- $db := .Values.database }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Release.Name }}-db
spec:
  instances: {{ $db.instances }}
  imageName: {{ $db.imageName }}
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: stalwart
      owner: stalwart
  storage:
    size: {{ $db.size }}
    storageClass: {{ $db.storageClass }}
    resizeInUseVolumes: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Release.Name }}-db-store
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Release.Name }}-db-store
spec:
  # The plugin's 50m CPU default throttles the archiver, which compresses and
  # uploads every WAL segment.
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 256Mi
  configuration:
    destinationPath: {{ $db.backup.destinationPath }}
    endpointURL: {{ $db.backup.endpointURL }}
    s3Credentials:
      accessKeyId:
        name: s3-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: s3-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: {{ $db.backup.retentionPolicy }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Release.Name }}-db-daily
spec:
  schedule: {{ $db.backup.schedule | quote }}
  backupOwnerReference: self
  cluster:
    name: {{ .Release.Name }}-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
