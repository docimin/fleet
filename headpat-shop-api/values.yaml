replicaCount: 1

name: headpat-shop-api

image:
  repository: harbor.fayevr.dev/fleet/headpat-shop-api
  tag: "0.1.0"
  pullPolicy: Always

redis:
  enabled: true
  image: redis:7-alpine

migrate:
  enabled: true
  tag: "0.1.0-migrate"
  backoffLimit: 6

postgres:
  enabled: true
  name: headpat-shop-pg
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
  database: shop
  owner: shop
  storage:
    size: 10Gi
    storageClass: ceph-rbd-kubernetes
  # Single instance, so there is no replica to fall back on: without WAL
  # archiving plus a base backup, a lost PVC is unrecoverable.
  backup:
    enabled: true
    bucket: k8s-apps
    endpointURL: https://s3.headpat.space
    vaultKey: apps-panel/s3-backup-credentials
    secretStore: vault-apps-panel
    retention: 30d
    schedule: "0 45 3 * * *"

service:
  type: ClusterIP
  port: 80
  targetPort: 8787

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.headpat.shop
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - api.headpat.shop
      secretName: headpat-shop-api-tls-secret

externalSecret:
  enabled: true
  refreshInterval: "5m"
  storeRef:
    kind: ClusterSecretStore
    name: vault-headpat
  remoteRef:
    key: headpat-shop/api-env
  targetSecretName: headpat-shop-api-env

secrets:
  name: headpat-shop-api-env
  imagePullSecrets:
    - name: harbor-secret

resources:
  limits:
    memory: "1Gi"
    cpu: "1000m"
  requests:
    memory: "256Mi"
    cpu: "100m"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8787"

probes:
  liveness:
    path: "/health"
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1
  readiness:
    path: "/health"
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

autoscaling:
  enabled: false

pdb:
  enabled: false

serviceAccount:
  name: headpat-shop-api
